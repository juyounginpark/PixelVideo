<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL · 로컬 캐릭터 공방</title>
<link rel="stylesheet" href="/web/style.css">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<aside>
  <header><span class="eyebrow">PIXEL / CHARACTER LAB</span><h1>로컬 캐릭터 공방<span>작은 상자로 만드는 내 캐릭터</span></h1><p id="auth">Codex 로그인 확인 중…</p></header>
  <div class="model-settings"><label for="modelSelect">OAuth 모델</label><div class="row"><select id="modelSelect" aria-label="OAuth 모델" disabled><option>목록 조회 중…</option></select><select id="effortSelect" aria-label="추론 강도" disabled><option>low</option></select></div><button id="refreshModels" type="button">목록 새로고침</button><p id="modelInfo" class="hint"></p></div>
  <form id="form"><label for="prompt">어떤 캐릭터를 만들까요?</label>
    <textarea id="prompt" rows="3" maxlength="2000" placeholder="예: 헤드폰을 낀 졸린 고양이" required></textarea>
    <label class="check"><input type="checkbox" id="edit"> 현재 캐릭터를 수정하기</label>
    <div class="row"><button id="generate" type="submit" class="primary" disabled>캐릭터 만들기 ↗</button><button id="cancel" type="button" hidden>취소</button></div>
    <div id="stages" class="stages" aria-label="제작 단계"><span data-stage="model">1 모델</span><span data-stage="rig">2 관절</span><span data-stage="motion">3 동작</span><span data-stage="play">4 재생</span></div>
    <p id="status" role="status" aria-live="polite">준비 중…</p>
    <p class="hint">ChatGPT 로그인으로 Codex를 호출합니다. AI 생성에는 인터넷 연결이 필요합니다.</p>
  </form>
  <div class="section"><label for="motionSelect">캐릭터 애니메이션</label><div class="row"><select id="motionSelect"></select><button id="playPause" type="button">일시정지</button><button id="restPose" type="button">기본 자세</button></div><div class="row"><label class="check" for="speed">속도 <output id="speedValue">1.0×</output></label><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" aria-label="재생 속도"></div><label class="check"><input id="showJoints" type="checkbox"> 관절 보기</label><p id="rigInfo" class="hint"></p><p id="motionInfo" class="hint"></p></div>
  <div class="section"><label for="template">기본 캐릭터 바로 보기</label><div class="row"><select id="template"></select><button id="load">불러오기</button></div></div>
  <div class="section"><label for="background">화면 설정</label><div class="row"><input id="background" type="color" value="#fff8f3" aria-label="배경색"><label class="check"><input type="checkbox" id="retro"> 레트로 TV</label><button id="fit">화면 맞춤</button></div></div>
  <details><summary>모델 명령 편집</summary><textarea id="code" rows="8" spellcheck="false" aria-label="모델 명령"></textarea><button id="apply">명령 적용</button></details>
  <div class="section"><label>모델 저장</label><div class="row wrap"><button id="glb">GLB + 동작</button><button id="obj">OBJ</button><button id="mtl">MTL</button><button id="json">Three.js</button><button id="boxes">명령 파일</button><button id="png">PNG</button></div><p class="hint">GLB·Three.js에는 관절과 동작 클립이 포함됩니다. OBJ는 현재 자세이며 MTL과 함께 저장해 주세요.</p></div>
</aside>
<main><canvas id="view" aria-label="3D 캐릭터 미리보기"></canvas><div class="view-label"><span class="dot"></span> LOCAL STUDIO <span id="count"></span></div><div class="gesture">드래그로 회전 · 휠로 확대</div></main>
<script type="module" src="/web/main.js"></script>
</body></html>

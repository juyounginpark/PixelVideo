<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>쓸궁지 캐릭터 공방</title>
<meta name="description" content="원하는 걸 적으면 쓸궁지 스타일 3D 캐릭터로 만들어 줘요. 프로필 사진으로 저장도 돼요.">
<meta name="theme-color" content="#fff8f3">
<meta property="og:title" content="쓸궁지 캐릭터 공방">
<meta property="og:description" content="적기만 하면 나만의 3D 캐릭터가 뚝딱. 프로필 사진으로도 저장돼요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='5' width='22' height='22' rx='5' fill='%232b2433'/%3E%3Crect x='3' y='3' width='22' height='22' rx='5' fill='%23ff7b7b'/%3E%3Crect x='9' y='11' width='3' height='4' fill='%232b2433'/%3E%3Crect x='16' y='11' width='3' height='4' fill='%232b2433'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" aria-label="3D 캐릭터 화면"></canvas>

<header class="top">
  <a class="brand" href="https://www.instagram.com/useless.curious/" target="_blank" rel="noopener">
    <span class="dot" aria-hidden="true"></span>
    <span class="name"><b>쓸궁지 캐릭터 공방</b><small>@useless.curious</small></span>
  </a>
  <button id="btnRecent" class="pill" type="button">내 작품</button>
</header>

<div id="empty" class="empty">
  <p class="big">적기만 하면<br><em>3D 캐릭터</em>가 뚝딱</p>
  <p class="small">만든 캐릭터는 프로필 사진으로 저장할 수 있어요</p>
</div>

<div id="status" class="status" hidden><span class="spinner"></span><span id="statusText">만드는 중…</span></div>

<!-- 프로필 모드: 동그란 미리보기 틀 -->
<div id="ring" class="ring" hidden></div>

<section id="sheet" class="sheet">
  <div id="makePanel">
    <div id="chips" class="chips" aria-label="예시"></div>
    <form id="form" class="ask">
      <input id="prompt" maxlength="200" autocomplete="off" enterkeyhint="go" placeholder="예: 헤드폰 낀 졸린 고양이" aria-label="만들고 싶은 것">
      <button id="go" type="submit">만들기</button>
    </form>
    <div id="after" class="after" hidden>
      <button id="btnProfile" class="primary" type="button">프로필 사진 만들기</button>
      <button id="btnShare" class="ghost" type="button">공유</button>
      <button id="btnNew" class="ghost" type="button">새로</button>
    </div>
  </div>

  <div id="profilePanel" hidden>
    <p class="hint">드래그로 각도, 두 손가락으로 크기를 맞춰요</p>
    <div id="swatches" class="swatches" role="group" aria-label="배경색">
      <label class="sw custom" title="다른 색"><input id="bgPick" type="color" value="#ff7b7b" aria-label="다른 배경색"></label>
    </div>
    <div class="row toggles">
      <label class="toggle"><input id="shadowOn" type="checkbox" checked><span>그림자</span></label>
      <label class="toggle"><input id="retroOn" type="checkbox"><span>레트로 TV</span></label>
    </div>
    <div class="row">
      <button id="btnBack" class="ghost" type="button">뒤로</button>
      <button id="btnSave" class="primary grow" type="button">사진 저장</button>
    </div>
  </div>
</section>

<dialog id="saveDlg" class="dlg">
  <img id="saveImg" alt="만든 프로필 사진">
  <p class="hint">안 받아지면 사진을 길게 눌러 저장하세요</p>
  <div class="row">
    <a id="saveLink" class="primary grow" download="useless-curious-character.png">다운로드</a>
    <button class="ghost" type="button" onclick="this.closest('dialog').close()">닫기</button>
  </div>
</dialog>

<dialog id="recentDlg" class="dlg">
  <h2>내 작품</h2>
  <div id="recentList" class="recent"></div>
  <p class="hint">이 기기에만 저장돼요</p>
  <div class="row"><button class="ghost grow" type="button" onclick="this.closest('dialog').close()">닫기</button></div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
